<head>

<style>
:root{--navy:#081628;--navy2:#0d1f3c;--blue:#1565c0;--bl:#42a5f5;--cy:#00b4ff;--w:#fff;--gm:#8faac8;--gl:#e3eaf5;--r:14px;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:"Montserrat","Heebo",sans-serif;background:var(--navy);color:var(--w);overflow-x:hidden;min-height:100vh;}
body.rtl{font-family:"Heebo",sans-serif;}
body::before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 20%,rgba(33,150,243,.1) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(0,180,255,.08) 0%,transparent 50%),linear-gradient(180deg,#081628,#060f1e);pointer-events:none;}
a{color:inherit;}

/* NAV (same as main site) */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 5vw;background:rgba(8,22,40,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(33,150,243,.15);}
.logo-wrap{display:flex;align-items:center;gap:.55rem;text-decoration:none;}
.logo-img{height:52px;width:auto;filter:drop-shadow(0 0 8px rgba(0,180,255,.6));}
.logo-side{display:flex;flex-direction:column;}
.logo-name{font-size:.95rem;font-weight:800;color:#fff;letter-spacing:-.3px;}
.logo-name span{color:var(--cy);}
.logo-sub{font-size:.58rem;font-weight:600;color:var(--gm);letter-spacing:1.5px;text-transform:uppercase;}
.nav-links{display:flex;gap:2rem;list-style:none;align-items:center;}
.nav-links a{color:var(--gm);text-decoration:none;font-size:.85rem;font-weight:600;transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--cy);}
.nav-right{display:flex;gap:.8rem;align-items:center;}
.lang-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--gm);padding:.4rem 1rem;border-radius:100px;cursor:pointer;font-size:.82rem;font-weight:600;font-family:inherit;transition:all .2s;}
.lang-btn:hover{border-color:var(--cy);color:var(--cy);}
.nav-cta{background:linear-gradient(135deg,var(--blue),var(--cy));color:#fff;padding:.55rem 1.4rem;border-radius:100px;font-size:.88rem;font-weight:700;text-decoration:none;box-shadow:0 4px 15px rgba(33,150,243,.3);transition:all .2s;white-space:nowrap;}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(33,150,243,.5);}

/* HERO — the AI Monday GIF banner */
.hero{position:relative;z-index:1;padding:110px 5vw 2.5rem;text-align:center;}
.banner{display:block;width:100%;max-width:900px;height:auto;margin:0 auto;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(66,165,245,.25);}

/* SECTION — light, easy to read (same light palette as the home page) */
.sec{position:relative;z-index:1;padding:3.5rem 5vw 5rem;background:#f0f4f8;color:#1a2840;}
.inner{max-width:1100px;margin:0 auto;}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:2rem;}
.stag{display:inline-block;background:rgba(21,101,192,.1);color:#1565c0;border:1px solid rgba(21,101,192,.25);padding:.3rem .9rem;border-radius:100px;font-size:.72rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:.8rem;}
.sh h2{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:900;letter-spacing:-.5px;color:#0d1f3c;}
.sh .week{color:#4a6080;font-size:.95rem;margin-top:.4rem;}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;}
.fbtn{background:#fff;border:1px solid #d0dcea;color:#4a6080;padding:.45rem 1.05rem;border-radius:100px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.fbtn:hover{border-color:#1565c0;color:#1565c0;}
.fbtn.on{background:#1565c0;border-color:#1565c0;color:#fff;}

/* POSTS */
.feat{display:grid;grid-template-columns:1fr 1.1fr;gap:2.2rem;background:#fff;border:1px solid #d0dcea;border-top:5px solid #00b4ff;border-radius:18px;padding:2.4rem;margin-bottom:1.8rem;box-shadow:0 10px 30px rgba(13,31,60,.08);}
.feat h3{font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:900;line-height:1.25;margin:.7rem 0 0;color:#0d1f3c;}
.feat p{color:#2a3d5c;line-height:1.85;font-size:1.05rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;}
.card{background:#fff;border:1px solid #d0dcea;border-radius:var(--r);padding:1.7rem;display:flex;flex-direction:column;gap:.85rem;box-shadow:0 4px 14px rgba(13,31,60,.05);transition:transform .25s,box-shadow .25s,border-color .25s;}
.card:hover{transform:translateY(-4px);border-color:#90c4f5;box-shadow:0 14px 30px rgba(13,31,60,.12);}
.meta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.78rem;color:#6a7f9c;font-weight:600;}
.tag{background:#e3f1fd;color:#1565c0;border-radius:100px;padding:.22rem .75rem;font-weight:800;letter-spacing:.3px;}
.card h3{font-size:1.18rem;font-weight:800;line-height:1.4;color:#0d1f3c;}
.card p{color:#3a4f6e;font-size:.97rem;line-height:1.75;}
.why{background:#f3f8fe;border-inline-start:4px solid #00b4ff;border-radius:8px;padding:.8rem 1rem;font-size:.92rem;line-height:1.65;color:#1a2840;}
.why b{color:#1565c0;}
.more{margin-top:auto;color:#1565c0;font-weight:800;font-size:.88rem;text-decoration:none;}
.more:hover{text-decoration:underline;}
.empty{color:#4a6080;text-align:center;padding:3rem 0;}

footer{position:relative;z-index:1;border-top:1px solid rgba(33,150,243,.15);padding:2rem 5vw;color:rgba(255,255,255,.45);font-size:.85rem;text-align:center;}
footer a{color:var(--gm);text-decoration:none;}

@media(max-width:900px){
  nav{padding:.7rem 1rem;} .nav-links{display:none;} .logo-img{height:42px;} .nav-cta{display:none;}
  .hero{padding:90px .75rem 1.5rem;} .banner{border-radius:10px;}
  .feat{grid-template-columns:1fr;padding:1.6rem;}
  .sec{padding:1rem 1rem 4rem;} .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

  <a class="logo-wrap" href="index.html">

<header class="hero">
  <img class="banner" src="assets/ai-monday-banner.gif" width="600" height="178" alt="AI Monday – The week's most interesting AI stories – by SmartYT · 07356 042086">
</header>

<main class="sec">
  <div class="inner">
    <div class="sh">
      <div>
        <span class="stag" data-en="This week" data-he="השבוע">This week</span>
        <h2 data-en="The stories worth your time" data-he="הסיפורים ששווים את הזמן שלך">The stories worth your time</h2>

</main>

<footer>
  <p><span data-en="© 2026 Smart YT · Smart Business Solutions · London, UK" data-he="© 2026 Smart YT · פתרונות עסקיים חכמים · לונדון">© 2026 Smart YT · Smart Business Solutions · London, UK</span> · <a href="index.html" data-en="Back to home" data-he="חזרה לדף הבית">Back to home</a></p>
</footer>

<script>
/* ============================================================
   AI MONDAY POSTS — to add a story, copy one block and edit it.
   Newest first. "featured": true = the big card at the top.
   ============================================================ */
var POSTS = [
  {
    date: "2026-11-09", featured: true, tag: "Open models",
    title_en: "Mistral releases Large 4 as open weights",
    title_he: "Mistral משחררת את Large 4 כמודל פתוח",
    text_en: "Mistral AI published Large 4 — a 1-trillion-parameter model — as open weights under a modified MIT licence. Companies that resell it as a hosted service need a separate commercial agreement.",
    text_he: "Mistral AI פרסמה את Large 4 — מודל עם טריליון פרמטרים — כמשקלים פתוחים ברישיון MIT מותאם. חברות שמוכרות אותו כשירות מאוחסן צריכות הסכם מסחרי נפרד.",
    why_en: "Top-tier AI you can run on your own servers is getting closer — good news for businesses that can't send data to outside services.",
    why_he: "AI ברמה גבוהה שאפשר להריץ על שרתים משלכם הולך ומתקרב — חדשות טובות לעסקים שלא יכולים לשלוח מידע לשירותים חיצוניים.",
    link: "https://mistral.ai/news/mistral-large-4-oss/"
  },
  {
    date: "2026-11-06", tag: "Shopping",
    title_en: "Amazon lets customers text Alexa to shop",
    title_he: "אמזון מאפשרת לקנות דרך הודעות טקסט לאלקסה",
    text_en: "Amazon opened text-based shopping through Alexa, starting with invited US customers — weeks after it blocked Meta's Muse shopping agent from its store.",
    text_he: "אמזון פתחה קניות בהודעות טקסט דרך אלקסה, בשלב ראשון ללקוחות מוזמנים בארה\"ב — שבועות אחרי שחסמה את סוכן הקניות Muse של Meta מהחנות שלה.",
    why_en: "AI agents that buy on behalf of customers are arriving. Clear product info and easy ordering will matter more than ever.",
    why_he: "סוכני AI שקונים בשם הלקוח כבר כאן. מידע ברור על המוצרים והזמנה פשוטה יהיו חשובים מאי פעם.",
    link: "https://techcrunch.com/2026/11/06/after-blocking-muse-amazon-now-lets-users-text-alexa-to-help-them-shop/"
  },
  {
    date: "2026-11-06", tag: "OpenAI",
    title_en: "OpenAI reportedly raises $11B at a $1.25T valuation",
    title_he: "דיווח: OpenAI גייסה 11 מיליארד דולר לפי שווי של 1.25 טריליון",
    text_en: "OpenAI has reportedly raised another $11B — less than the $30B it was seeking — and the round is still open.",
    text_he: "לפי דיווח, OpenAI גייסה עוד 11 מיליארד דולר — פחות מ-30 המיליארד שביקשה — והסבב עדיין פתוח.",
    why_en: "The money behind ChatGPT keeps flowing, so expect new features and tools to keep landing fast.",
    why_he: "הכסף מאחורי ChatGPT ממשיך לזרום, אז צפו שפיצ'רים וכלים חדשים ימשיכו להגיע מהר.",
    link: "https://techcrunch.com/2026/11/06/openai-reportedly-raises-an-additional-11-billion-at-a-1-25-trillion-valuation/"
  },
  {
    date: "2026-11-04", tag: "Images & video",
    title_en: "Fal raises $1.3B — Adobe, Canva and Shopify use it for AI images and video",
    title_he: "Fal גייסה 1.3 מיליארד דולר — Adobe, Canva ו-Shopify משתמשות בה לתמונות ווידאו",
    text_en: "Generative-media platform Fal raised $1.3B at a $16B valuation, double its April value. Adobe, Canva and Shopify run production image and video work on it.",
    text_he: "פלטפורמת המדיה הגנרטיבית Fal גייסה 1.3 מיליארד דולר לפי שווי של 16 מיליארד — כפול מאפריל. Adobe, Canva ו-Shopify מריצות עליה עבודות תמונה ווידאו.",
    why_en: "The design tools you already use are quietly getting stronger AI image and video features.",
    why_he: "כלי העיצוב שאתם כבר עובדים איתם מקבלים בשקט יכולות תמונה ווידאו חזקות יותר.",
    link: "https://tech.eu/2026/11/04/fal-doubles-valuation-to-16b-after-13b-series-f/"
  },
  {
    date: "2026-11-04", tag: "Coding agents",
    title_en: "Meta buys Conductor, the app that runs several coding agents at once",
    title_he: "Meta קונה את Conductor — האפליקציה שמריצה כמה סוכני קוד במקביל",
    text_en: "Conductor runs Claude Code, Codex and Cursor agents side by side. Its team joins Meta, and Conductor Cloud shuts down on 20 November, deleting stored data.",
    text_he: "Conductor מריצה סוכנים של Claude Code, Codex ו-Cursor זה לצד זה. הצוות עובר ל-Meta, ו-Conductor Cloud נסגרת ב-20 בנובמבר והנתונים יימחקו.",
    why_en: "Using Conductor? Export your work before 20 November.",
    why_he: "משתמשים ב-Conductor? ייצאו את העבודה שלכם לפני 20 בנובמבר.",
    link: "https://siliconangle.com/2026/11/04/meta-acquires-ai-coding-startup-conductor-whose-app-runs-several-coding-agents-at-once/"
  }
];

var isHe = false, filter = "all";
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString(isHe?"he-IL":"en-GB",{day:"numeric",month:"long",year:"numeric"});}
function t(p,k){return isHe?(p[k+"_he"]||p[k+"_en"]):(p[k+"_en"]||p[k+"_he"]);}
function cardHTML(p,big){
  var why=t(p,"why")?'<div class="why"><b>'+(isHe?"מה זה אומר לעסק שלך: ":"Why it matters: ")+'</b>'+esc(t(p,"why"))+'</div>':"";
  var more=p.link?'<a class="more" target="_blank" rel="noopener" href="'+esc(p.link)+'">'+(isHe?"לכתבה המלאה ←":"Read the full story →")+'</a>':"";
  var meta='<div class="meta"><span class="tag">'+esc(p.tag)+'</span><span>'+fmt(p.date)+'</span></div>';
  if(big) return '<article class="feat"><div>'+meta+'<h3>'+esc(t(p,"title"))+'</h3></div><div style="display:flex;flex-direction:column;gap:1rem"><p>'+esc(t(p,"text"))+'</p>'+why+more+'</div></article>';
  return '<article class="card">'+meta+'<h3>'+esc(t(p,"title"))+'</h3><p>'+esc(t(p,"text"))+'</p>'+why+more+'</article>';
}
function render(){
  var list=POSTS.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var tags=["all"];list.forEach(function(p){if(tags.indexOf(p.tag)<0)tags.push(p.tag);});
  document.getElementById("filters").innerHTML=tags.map(function(g){return '<button class="fbtn'+(g===filter?" on":"")+'" data-t="'+esc(g)+'">'+(g==="all"?(isHe?"הכל":"All"):esc(g))+'</button>';}).join("");
  document.querySelectorAll(".fbtn").forEach(function(b){b.onclick=function(){filter=b.getAttribute("data-t");render();};});
  var shown=filter==="all"?list:list.filter(function(p){return p.tag===filter;});
  var feat=filter==="all"?(shown.filter(function(p){return p.featured;})[0]||shown[0]):null;
  document.getElementById("featured").innerHTML=feat?cardHTML(feat,true):"";
  var rest=shown.filter(function(p){return p!==feat;});
  document.getElementById("grid").innerHTML=rest.length||feat?rest.map(function(p){return cardHTML(p,false);}).join(""):'<p class="empty">'+(isHe?"אין עדיין כתבות":"No stories yet")+'</p>';
  if(list.length){var d=new Date(list[0].date+"T12:00:00");var day=d.getDay();var mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7));
    document.getElementById("weekLabel").textContent=(isHe?"שבוע של ":"Week of ")+mon.toLocaleDateString(isHe?"he-IL":"en-GB",{day:"numeric",month:"long",year:"numeric"});}
}
function applyLang(){
  document.querySelector(".lang-btn").textContent=isHe?"🇬🇧 English":"🇮🇱 עברית";
  document.body.classList.toggle("rtl",isHe);
  document.documentElement.lang=isHe?"he":"en";
  document.documentElement.dir=isHe?"rtl":"ltr";
  document.querySelectorAll("[data-en][data-he]").forEach(function(el){el.innerHTML=isHe?el.getAttribute("data-he"):el.getAttribute("data-en");});
  render();
}
function toggleLang(){isHe=!isHe;try{localStorage.setItem("aim_lang",isHe?"he":"en");}catch(e){}applyLang();}
(function(){var q=new URLSearchParams(location.search).get("lang");var s=null;try{s=localStorage.getItem("aim_lang");}catch(e){}isHe=(q||s)==="he";applyLang();})();
</script>
</body>
