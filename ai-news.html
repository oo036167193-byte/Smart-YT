<style>
:root{--navy:#081628;--navy2:#0d1f3c;--blue:#1565c0;--bl:#42a5f5;--cy:#00b4ff;--w:#fff;--gm:#8faac8;--gl:#e3eaf5;--r:14px;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:"Montserrat","Heebo",sans-serif;background:var(--navy);color:var(--w);overflow-x:hidden;min-height:100vh;}
body.rtl{font-family:"Heebo",sans-serif;}
body::before{content:"";position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 20%,rgba(33,150,243,.1) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(0,180,255,.08) 0%,transparent 50%),linear-gradient(180deg,#081628,#060f1e);pointer-events:none;}
a{color:inherit;}

/* NAV (same as main site) */
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 5vw;background:rgba(8,22,40,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(33,150,243,.15);}
.logo-wrap{display:flex;align-items:center;gap:.55rem;text-decoration:none;}
.logo-img{height:52px;width:auto;filter:drop-shadow(0 0 8px rgba(0,180,255,.6));}
.logo-side{display:flex;flex-direction:column;}
.logo-name{font-size:.95rem;font-weight:800;color:#fff;letter-spacing:-.3px;}
.logo-name span{color:var(--cy);}
.logo-sub{font-size:.58rem;font-weight:600;color:var(--gm);letter-spacing:1.5px;text-transform:uppercase;}
.nav-links{display:flex;gap:2rem;list-style:none;align-items:center;}
.nav-links a{color:var(--gm);text-decoration:none;font-size:.85rem;font-weight:600;transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--cy);}
.nav-right{display:flex;gap:.8rem;align-items:center;}
.lang-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:var(--gm);padding:.4rem 1rem;border-radius:100px;cursor:pointer;font-size:.82rem;font-weight:600;font-family:inherit;transition:all .2s;}
.lang-btn:hover{border-color:var(--cy);color:var(--cy);}
.nav-cta{background:linear-gradient(135deg,var(--blue),var(--cy));color:#fff;padding:.55rem 1.4rem;border-radius:100px;font-size:.88rem;font-weight:700;text-decoration:none;box-shadow:0 4px 15px rgba(33,150,243,.3);transition:all .2s;white-space:nowrap;}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(33,150,243,.5);}

/* HERO: the AI Monday banner (top part of the GIF) + a sharp row of tool logos.
   Sizes are in cqw (percent of the banner width) so it looks the same on every screen. */
.hero{position:relative;z-index:1;padding:110px 5vw 2.5rem;}
.banner{container-type:inline-size;max-width:1100px;margin:0 auto;border-radius:12px;overflow:hidden;background:#011033;box-shadow:0 14px 40px rgba(0,0,0,.45);direction:ltr;}
.banner-top{aspect-ratio:1100/256;overflow:hidden;}
.banner-top img{display:block;width:100%;height:auto;}
.tools{overflow:hidden;padding:1.7cqw 0 1.9cqw;border-top:.3cqw solid #1a8bfc;}
.track{display:flex;width:max-content;animation:toolsMove 24s linear infinite;}
.tools:hover .track{animation-play-state:paused;}
.track .tool{margin-right:2.2cqw;flex-shrink:0;}
@keyframes toolsMove{from{transform:translateX(0)}to{transform:translateX(-25%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none;}}
.tool{background:#fff;border-radius:10cqw;height:4cqw;padding:0 1.25cqw;display:inline-flex;align-items:center;gap:.7cqw;font-family:"Montserrat",sans-serif;font-weight:600;font-size:1.6cqw;color:#111;white-space:nowrap;box-shadow:0 .3cqw .9cqw rgba(0,0,0,.25);}
.tool img{display:block;width:auto;}
.tool .ic{height:2.2cqw;}
.tool .rd{border-radius:.45cqw;}
.tool .wm{height:1.65cqw;}
.tool .mk{height:1.55cqw;}
.tool .gk{height:2.1cqw;}
.tool .nb{height:1.4cqw;}

/* SECTION: light, easy to read (same light palette as the home page) */
.sec{position:relative;z-index:1;padding:3.5rem 5vw 5rem;background:#f0f4f8;color:#1a2840;}
.inner{max-width:1100px;margin:0 auto;}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:2rem;}
.stag{display:inline-block;background:rgba(21,101,192,.1);color:#1565c0;border:1px solid rgba(21,101,192,.25);padding:.3rem .9rem;border-radius:100px;font-size:.72rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:.8rem;}
.sh h2{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:900;letter-spacing:-.5px;color:#0d1f3c;}
.sh .week{color:#4a6080;font-size:.95rem;margin-top:.4rem;}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;}
.fbtn{background:#fff;border:1px solid #d0dcea;color:#4a6080;padding:.45rem 1.05rem;border-radius:100px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.fbtn:hover{border-color:#1565c0;color:#1565c0;}
.fbtn.on{background:#1565c0;border-color:#1565c0;color:#fff;}

/* POSTS */
.feat{display:grid;grid-template-columns:1fr 1.1fr;gap:2.2rem;background:#fff;border:1px solid #d0dcea;border-top:5px solid #00b4ff;border-radius:18px;padding:2.4rem;margin-bottom:1.8rem;box-shadow:0 10px 30px rgba(13,31,60,.08);}
.feat h3{font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:900;line-height:1.25;margin:.7rem 0 0;color:#0d1f3c;}
.feat p{color:#2a3d5c;line-height:1.85;font-size:1.05rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;}
.card{background:#fff;border:1px solid #d0dcea;border-radius:var(--r);padding:1.7rem;display:flex;flex-direction:column;gap:.85rem;box-shadow:0 4px 14px rgba(13,31,60,.05);transition:transform .25s,box-shadow .25s,border-color .25s;}
.card:hover{transform:translateY(-4px);border-color:#90c4f5;box-shadow:0 14px 30px rgba(13,31,60,.12);}
.meta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-size:.78rem;color:#6a7f9c;font-weight:600;}
.tag{background:#e3f1fd;color:#1565c0;border-radius:100px;padding:.22rem .75rem;font-weight:800;letter-spacing:.3px;}
.card h3{font-size:1.18rem;font-weight:800;line-height:1.4;color:#0d1f3c;}
.card p{color:#3a4f6e;font-size:.97rem;line-height:1.75;}
.why{background:#f3f8fe;border-inline-start:4px solid #00b4ff;border-radius:8px;padding:.85rem 1rem;font-size:.92rem;line-height:1.65;color:#1a2840;}
.why b{color:#1565c0;display:block;margin-bottom:.35rem;}
.why ul{margin:0;padding-inline-start:1.1rem;}
.why li{margin:.25rem 0;}
.links{margin-top:auto;display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;}
.more{color:#1565c0;font-weight:800;font-size:.88rem;text-decoration:none;background:none;border:0;cursor:pointer;font-family:inherit;padding:0;}
.more:hover{text-decoration:underline;}
.full-btn{background:#1565c0;color:#fff;border-radius:100px;padding:.5rem 1.1rem;}
.full-btn:hover{background:#0d4fa0;text-decoration:none;}
.empty{grid-column:1/-1;background:#fff;border:1px dashed #b9cbe2;border-radius:18px;color:#4a6080;text-align:center;padding:3.5rem 1.5rem;display:flex;flex-direction:column;gap:.6rem;}
.empty b{font-size:1.35rem;color:#0d1f3c;}

/* FULL STORY */
.story{position:fixed;inset:0;z-index:300;background:rgba(6,15,30,.7);backdrop-filter:blur(6px);display:none;overflow-y:auto;padding:90px 1rem 3rem;}
.story.open{display:block;}
.story-box{max-width:760px;margin:0 auto;background:#fff;color:#1a2840;border-radius:18px;padding:2.6rem 2.4rem;box-shadow:0 20px 60px rgba(0,0,0,.4);position:relative;}
.story-box h1{font-size:clamp(1.6rem,3.5vw,2.3rem);font-weight:900;line-height:1.25;color:#0d1f3c;margin:.8rem 0 1.4rem;}
.story-box p{font-size:1.06rem;line-height:1.9;color:#2a3d5c;margin-bottom:1.1rem;}
.story-box .why{margin:1.6rem 0;font-size:1rem;}
.post-ic{width:22px;height:22px;border-radius:6px;display:block;}
.post-img{display:block;width:100%;height:auto;border-radius:12px;margin-top:1.2rem;border:1px solid #e3eaf5;}
.card .post-img{margin:0 0 .3rem;}
.story-img{display:block;width:100%;height:auto;border-radius:12px;margin:1.2rem 0 1.4rem;border:1px solid #e3eaf5;}
.story-box h2{font-size:1.2rem;font-weight:800;color:#1565c0;margin:1.6rem 0 .6rem;}
.story-box ul{margin:0 0 1.1rem;padding-inline-start:1.3rem;}
.story-box li{font-size:1.04rem;line-height:1.8;color:#2a3d5c;margin:.2rem 0;}
.video{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;margin:1.4rem 0 1.6rem;background:#000;}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.srcs{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:center;border-top:1px solid #d0dcea;padding-top:1rem;margin-top:1.6rem;font-size:.9rem;}
.srcs b{color:#4a6080;}
.story-close{position:absolute;top:1rem;inset-inline-end:1rem;width:40px;height:40px;border-radius:50%;border:1px solid #d0dcea;background:#f0f4f8;color:#1a2840;font-size:1.3rem;cursor:pointer;}
@media(max-width:900px){.story-box{padding:2rem 1.3rem;}}

footer{position:relative;z-index:1;border-top:1px solid rgba(33,150,243,.15);padding:2rem 5vw;color:rgba(255,255,255,.45);font-size:.85rem;text-align:center;}
footer a{color:var(--gm);text-decoration:none;}

@media(max-width:900px){
  nav{padding:.7rem 1rem;} .nav-links{display:none;} .logo-img{height:42px;} .nav-cta{display:none;}
  .hero{padding:90px .75rem 1.5rem;}
  .feat{grid-template-columns:1fr;padding:1.6rem;}
  .sec{padding:1rem 1rem 4rem;} .grid{grid-template-columns:1fr;}
}
</style>
</head>

var isHe = false, filter = "all";
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString(isHe?"he-IL":"en-GB",{day:"numeric",month:"long",year:"numeric"});}
function t(p,k){return isHe?(p[k+"_he"]||p[k+"_en"]):(p[k+"_en"]||p[k+"_he"]);}
function doBox(p){var d=t(p,"do");if(!d||!d.length)return"";return '<div class="why"><b>'+(isHe?"מה אפשר לעשות עם זה":"What you can do with it")+'</b><ul>'+d.map(function(x){return"<li>"+esc(x)+"</li>";}).join("")+'</ul></div>';}
function block(x){if(typeof x==="string")return"<p>"+esc(x)+"</p>";if(x.h)return"<h2>"+esc(x.h)+"</h2>";if(x.img)return'<img class="story-img" src="'+esc(x.img)+'" alt="'+esc(x.alt||"")+'" loading="lazy">';if(x.list)return"<ul>"+x.list.map(function(i){return"<li>"+esc(i)+"</li>";}).join("")+"</ul>";return"";}
function videoHTML(p){return p.video?'<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/'+esc(p.video)+'" title="Video" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>':"";}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return"";}}
function allLinks(p){return [p.link,p.link2].filter(Boolean).map(function(u){return '<a class="more" target="_blank" rel="noopener" href="'+esc(u)+'">'+esc(host(u))+(isHe?" ←":" →")+'</a>';}).join("");}
function srcLink(p){return p.link?'<a class="more" target="_blank" rel="noopener" href="'+esc(p.link)+'">'+(isHe?"למקור ←":"Source →")+'</a>':"";}
function linksHTML(p){var f=t(p,"full");var full=f&&f.length?'<button class="more full-btn" onclick="openStory(\''+p.id+'\')">'+(isHe?"לסיפור המלא":"Full story")+'</button>':"";return '<div class="links">'+full+srcLink(p)+'</div>';}
function meta(p){return '<div class="meta">'+(p.icon?'<img class="post-ic" src="'+esc(p.icon)+'" alt="">':'')+'<span class="tag">'+esc(p.tag)+'</span><span>'+fmt(p.date)+'</span></div>';}
function cardHTML(p,big){
  var pic=p.image?'<img class="post-img" src="'+esc(p.image)+'" alt="" loading="lazy">':'';
  if(big) return '<article class="feat"><div>'+meta(p)+'<h3>'+esc(t(p,"title"))+'</h3>'+pic+'</div><div style="display:flex;flex-direction:column;gap:1rem"><p>'+esc(t(p,"text"))+'</p>'+doBox(p)+linksHTML(p)+'</div></article>';
  return '<article class="card">'+pic+meta(p)+'<h3>'+esc(t(p,"title"))+'</h3><p>'+esc(t(p,"text"))+'</p>'+doBox(p)+linksHTML(p)+'</article>';
}
function render(){
  var list=POSTS.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var tags=["all"];list.forEach(function(p){if(tags.indexOf(p.tag)<0)tags.push(p.tag);});
  document.getElementById("filters").innerHTML=list.length<2?"":tags.map(function(g){return '<button class="fbtn'+(g===filter?" on":"")+'" data-t="'+esc(g)+'">'+(g==="all"?(isHe?"הכל":"All"):esc(g))+'</button>';}).join("");
  document.querySelectorAll(".fbtn").forEach(function(b){b.onclick=function(){filter=b.getAttribute("data-t");render();};});
  var shown=filter==="all"?list:list.filter(function(p){return p.tag===filter;});
  var feat=filter==="all"?(shown.filter(function(p){return p.featured;})[0]||shown[0]):null;
  document.getElementById("featured").innerHTML=feat?cardHTML(feat,true):"";
  var rest=shown.filter(function(p){return p!==feat;});
  document.getElementById("grid").innerHTML=rest.length||feat?rest.map(function(p){return cardHTML(p,false);}).join(""):'<div class="empty"><b>'+(isHe?"הסיפורים הראשונים בדרך":"The first stories are on the way")+'</b><span>'+(isHe?"AI Monday יוצא כל יום שני. כדאי לחזור לכאן בקרוב.":"AI Monday comes out every Monday. Check back soon.")+'</span></div>';
  if(list.length){var d=new Date(list[0].date+"T12:00:00");var day=d.getDay();var mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7));
    document.getElementById("weekLabel").textContent=(isHe?"שבוע של ":"Week of ")+mon.toLocaleDateString(isHe?"he-IL":"en-GB",{day:"numeric",month:"long",year:"numeric"});}
  showStoryFromHash();
}
function openStory(id){location.hash="story="+id;}
function closeStory(){history.replaceState(null,"",location.pathname+location.search);showStoryFromHash();}
function showStoryFromHash(){
  var m=location.hash.match(/story=([\w-]+)/);var el=document.getElementById("story");
  var p=m&&POSTS.filter(function(x){return x.id===m[1];})[0];
  if(!p||!t(p,"full")){el.classList.remove("open");document.body.style.overflow="";return;}
  var f=t(p,"full");var half=Math.ceil(f.length/3);
  document.getElementById("storyBox").innerHTML='<button class="story-close" onclick="closeStory()" aria-label="Close">×</button>'+meta(p)+'<h1>'+esc(t(p,"title"))+'</h1>'+(p.image?'<img class="story-img" src="'+esc(p.image)+'" alt="">':'')+f.slice(0,2).map(block).join("")+videoHTML(p)+f.slice(2).map(block).join("")+'<div class="srcs"><b>'+(isHe?"מקורות":"Sources")+'</b>'+allLinks(p)+'</div>';
  el.classList.add("open");el.scrollTop=0;document.body.style.overflow="hidden";
}
window.addEventListener("hashchange",showStoryFromHash);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeStory();});
function applyLang(){
  document.querySelector(".lang-btn").textContent=isHe?"🇬🇧 English":"🇮🇱 עברית";
  document.body.classList.toggle("rtl",isHe);
  document.documentElement.lang=isHe?"he":"en";
  document.documentElement.dir=isHe?"rtl":"ltr";
  document.querySelectorAll("[data-en][data-he]").forEach(function(el){el.innerHTML=isHe?el.getAttribute("data-he"):el.getAttribute("data-en");});
  render();
}
function toggleLang(){isHe=!isHe;try{localStorage.setItem("aim_lang",isHe?"he":"en");}catch(e){}applyLang();}
(function(){var q=new URLSearchParams(location.search).get("lang");var s=null;try{s=localStorage.getItem("aim_lang");}catch(e){}isHe=(q||s)==="he";applyLang();})();
</script>
</body>
</html>
